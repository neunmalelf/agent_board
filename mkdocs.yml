site_name: agent_board
site_description: agent_board - live status board for coding agents, plus the agent-watch notification daemon
site_url: ""
docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - scheme: default
      primary: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences

nav:
  - Home: index.md
  - Development: development.md
  - History: history.md